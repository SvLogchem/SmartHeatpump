reset_model:
  name: Reset geleerd model
  description: Wis het geleerde huis- en vloermodel en de avondcorrectie. Het model leert daarna opnieuw (enkele dagen).
  fields:
    percentage:
      name: Percentage opnieuw aanleren
      description: Hoeveel van het geleerde (huis- en vloermodel, avondcorrectie, stooklijncorrectie, bijsturing) opnieuw geleerd moet worden. 100 = alles.
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"

exporteer:
  name: Exporteer instellingen en geleerde gegevens
  description: Schrijft alle instellingen, schakelaars en (optioneel) wat de regeling geleerd heeft naar het bestand slimme_warmtepomp_export.json in je configuratiemap en geeft ze ook als antwoord terug.
  fields:
    pompkennis:
      name: Pompkennis
      description: Neem wat over de warmtepomp zelf geleerd is mee (frequentietabel, ontdooigedrag). Handig om te delen met iemand die dezelfde pomp heeft.
      default: true
      selector:
        boolean:
    huiskennis:
      name: Huiskennis
      description: Neem ook wat over jouw huis geleerd is mee (afkoeltijd, vloer, stooklijn, statistieken). Alleen voor een back-up van je eigen installatie; in een ander huis regelt dit verkeerd tot het is afgeleerd.
      default: false
      selector:
        boolean:

importeer:
  name: Importeer instellingen en geleerde gegevens
  description: Leest slimme_warmtepomp_export.json uit je configuratiemap (of de meegegeven gegevens) en past ze toe. Waarden worden binnen de toegestane grenzen gehouden.
  fields:
    pompkennis:
      name: Pompkennis
      description: Zet ook de pompkennis uit de export terug (frequentietabel, ontdooigedrag), voor zover de export die bevat.
      default: true
      selector:
        boolean:
    huiskennis:
      name: Huiskennis
      description: Zet ook de huiskennis uit de export terug (afkoeltijd, vloer, stooklijn, statistieken). Alleen voor het terugzetten van een back-up van dit huis.
      default: false
      selector:
        boolean:
    data:
      name: Gegevens
      description: Optioneel. De inhoud van een export; zonder wordt het bestand gebruikt.
      required: false
      selector:
        object:
