name: Release

# Maakt automatisch een GitHub-release (en tag) aan zodra de versie in manifest.json op main verandert.
# HACS toont dan het versienummer (bijv. v2.7.0) in plaats van een commit-hash.
on:
  push:
    branches: [main]
    paths:
      - custom_components/slimme_warmtepomp/manifest.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release aanmaken als de tag nog niet bestaat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('custom_components/slimme_warmtepomp/manifest.json'))['version'])")
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG bestaat al"; exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest
